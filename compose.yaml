services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-amx_dev}
      POSTGRES_USER: ${POSTGRES_USER:-amx_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amx_dev_only}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
